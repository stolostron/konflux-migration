    - release-mce-214
  origin: crt-redhat-acm-tenant
  policy: always-pass-policy
  data:
    mapping:
      components: 
        - name: insights-client-acm-214
          repository: quay.io/acm-d/insights-client-rhel9
        - name: klusterlet-addon-controller-acm-214
          repository: quay.io/acm-d/klusterlet-addon-controller-rhel9
        - name: acm-cli-acm-214
          repository: quay.io/acm-d/acm-cli-rhel9
        - name: multicluster-operators-channel-acm-214
          repository: quay.io/acm-d/multicluster-operators-channel-rhel9
        - name: must-gather-acm-214
          repository: quay.io/acm-d/must-gather-rhel9
        - name: governance-policy-addon-controller-acm-214
          repository: quay.io/acm-d/governance-policy-addon-controller-rhel9
        - name: search-indexer-acm-214
          repository: quay.io/acm-d/search-indexer-rhel9
