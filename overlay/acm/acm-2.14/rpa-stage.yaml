          repository: quay.io/acm-d/multicluster-observability-addon-rhel9
        - name: thanos-receive-controller-acm-214
          repository: quay.io/acm-d/thanos-receive-controller-rhel9
      defaults:
        tags:
          - "2.9.0-{{  incrementer  }}"
          - "2.9.0-{{ timestamp }}"
          - "2.9.0-{{ git_short_sha }}"
  pipeline:
    pipelineRef:
      resolver: git
      params:
        - name: url
          value: "https://github.com/konflux-ci/release-service-catalog.git"
        - name: revision
          value: stage
        - name: pathInRepo
          value: "pipelines/rh-advisories/rh-advisories.yaml"