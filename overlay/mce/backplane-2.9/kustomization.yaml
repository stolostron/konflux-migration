apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

nameSuffix: -mce-29
resources:
  - ../mce-base
  - releaseplan-dev.yaml
  - rpa-dev.yaml
  # - releaseplan-prod.yaml
  # - rpa-prod.yaml
  # - releaseplan-stage.yaml
  # - rpa-stage.yaml

patches:
  - target:
      kind: Application
    path: application-patch.yaml
  - target:
      kind: Component
    path: component-patch.yaml
  - target:
      kind: Component
      name: assisted.*
    path: ocm-branch-patch.yaml
  - target:
      kind: Component
      name: hypershift-release.*
    path: hypershift-branch-patch.yaml
  - target:
      kind: Component
      name: cluster-api.*
    path: openshift-branch-patch.yaml
  - target:
      kind: Component
      name: hive.*
    path: hive-branch-patch.yaml
  - target:
      kind: Component
      name: cluster-api-provider-agent.*
    path: cluster-api-provider-agent-branch-patch.yaml
  - patch: |-
      - op: replace
        path: /spec/source/git/revision
        value: release-4.19
    target:
      kind: Component
      name: "apiserver-network-proxy.*"
  - patch: |-
      - op: replace
        path: /spec/source/git/revision
        value: master
    target:
      kind: Component
      name: "aws-encryption-provider.*"
