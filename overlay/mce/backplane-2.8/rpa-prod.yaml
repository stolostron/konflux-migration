  name: rpa-prod-mce-28
  labels:
    release.appstudio.openshift.io/auto-release: 'false'
    pp.engineering.redhat.com/business-unit: <bu-name> #hybrid-cloud-experience ??
spec:
  applications:
    - release-mce-28
  data:
    releaseNotes:
      product_id: <product ID> # ??
      product_name: multicluster engine for Kubernetes
      product_version: 2.8.0
    mapping:
      components: 
        - name: addon-manager-mce-28 
          repository: registry.redhat.io/multicluster-engine/addon-manager-rhel9, 
        - name: backplane-must-gather-mce-28 
