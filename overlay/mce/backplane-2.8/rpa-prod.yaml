        - name: clusterlifecycle-state-metrics-mce-28 
          repository: registry.redhat.io/multicluster-engine/clusterlifecycle-state-metrics-rhel9, 
        - name: console-mce-mce-28 
          repository: registry.redhat.io/multicluster-engine/console-mce-rhel9, 
        - name: discovery-operator-mce-28 
          repository: registry.redhat.io/multicluster-engine/discovery-rhel9, 
        - name: hive-mce-28 
          repository: registry.redhat.io/multicluster-engine/hive-rhel9, 
        - name: hypershift-addon-operator-mce-28 
