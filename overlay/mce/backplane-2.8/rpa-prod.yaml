        tags:
          - "2.8.0-{{  incrementer  }}"
          - "2.8.0-{{ timestamp }}"
          - "2.8.0-{{ git_short_sha }}"
#    pushSourceContainer: true
#  pyxis:
#    secret: pyxis-production-secret
#    server: production
# environment: <sre-production>
  origin: mce-base
  pipeline:
    pipelineRef:
      resolver: git
      params:
        - name: url
          value: "https://github.com/konflux-ci/release-service-catalog.git"
        - name: revision
          value: production
        - name: pathInRepo
          value: "pipelines/rh-advisories/rh-advisories.yaml"
  policy: registry-standard #Need a policy to publish release
  serviceAccount: release-registry-prod 